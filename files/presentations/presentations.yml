# ---------------------------------------------------------------------
- title: "Climate Data Melding via Spatially Varying Bayesian Autoencoder"
  summary: "We develop a spatially varying, Bayesian autoencoder that imposes identifiability and interpretability constraints to create a coherent, feature‑preserving consensus across multiple climate data products, when no ground-truth is available."
